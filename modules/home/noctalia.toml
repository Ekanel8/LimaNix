    output = "eDP-1"
    placement_height = 1000.0
    placement_width = 1600.0
    rotation = 0.0
    type = "clock"

[osd]
background_opacity = 0.99999997764825821

[plugin_settings."dmopp/nixos-updates"]
flake_dir = "/home/doc/.dotfiles"

[plugin_settings."noctalia/screen_recorder"]
color_range = "full"
directory = "~/Videos"
filename_pattern = "recording_%d%m%Y_%H_%M"
video_source = "focused"

[plugins]
enabled = [ "noctalia/screen_recorder", "dmopp/nixos-updates" ]

[shell]
avatar_path = "/home/doc/.dotfiles/img/face.jpg"
password_style = "random"

    [shell.launcher]
    pinned = [ "org.gnome.seahorse.Application", "org.remmina.Remmina", "md.obsidian.Obsidian" ]

    [shell.screenshot]
    annotate = true
    directory = "/home/doc/Screenshots"
    filename_pattern = "%d.%m-%H:%M"
    skip_annotate_on_copy_save = true

[theme]
builtin = "Tokyo-Night"
community_palette = "Oxocarbon"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"

    [theme.templates]
    builtin_ids = [ "hyprland" ]

[wallpaper]
directory = "/home/doc/.dotfiles/img/wallpapers"
transition_on_startup = true

    [wallpaper.default]
    path = "/home/doc/.dotfiles/img/wallpapers/1.png"

    [wallpaper.last]
    path = "/home/doc/.dotfiles/img/wallpapers/1.png"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/doc/.dotfiles/img/wallpapers/1.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/doc/.dotfiles/img/wallpapers/1.png"

[widget.clock]
scale = 1.5

[widget.control-center]
custom_image = "/home/doc/.dotfiles/img/other/nixos-svgrepo-com.svg"

[widget.launcher]
enabled = false

[widget.media]
hide_when_no_media = true

[widget.recorder]
type = "noctalia/screen_recorder:recorder"

[widget.session]
enabled = false

[widget.updates]
highlight_color = "primary"
show_count = false
type = "dmopp/nixos-updates:updates"
